<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 20px;
}

.widget {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 0, 0, var(--bg-opacity, 0.75));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 12px 16px 12px 12px;
  width: 320px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  position: relative;
  overflow: hidden;
}

.widget.visible {
  opacity: var(--widget-opacity, 1);
  transform: translateY(0);
}

.widget.hidden {
  opacity: 0 !important;
  transform: translateY(20px);
}

/* Glow verde de fondo */
.widget::before {
  content: '';
  position: absolute;
  top: -30px;
  left: -30px;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(30, 215, 96, 0.15), transparent 70%);
  pointer-events: none;
  transition: opacity 0.5s;
}

/* Línea verde arriba */
.widget::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, #1ed760, rgba(30, 215, 96, 0.3), transparent);
  border-radius: 16px 16px 0 0;
}

/* Portada */
.album-art-wrap {
  position: relative;
  flex-shrink: 0;
}

.album-art {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  transition: opacity 0.4s ease;
  background: #1a1a1a;
}

.album-art.fade {
  opacity: 0;
}

/* Icono de Spotify en la portada */
.spotify-badge {
  position: absolute;
  bottom: -4px;
  right: -4px;
  width: 18px;
  height: 18px;
  background: #1ed760;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(0,0,0,0.8);
}

/* Info */
.info {
  flex: 1;
  min-width: 0;
}

.label {
  font-size: 9px;
  font-weight: 600;
  color: #1ed760;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.label-dot {
  width: 5px;
  height: 5px;
  background: #1ed760;
  border-radius: 50%;
  animation: blink 1.5s ease infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.track-name-wrap, .artist-name-wrap {
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  width: 100%;
  max-width: 100%;
}

.track-name {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  line-height: 1.2;
  margin-bottom: 3px;
  transition: opacity 0.3s;
  display: inline-block;
}

.artist-name {
  font-size: 11px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
  margin-bottom: 8px;
  transition: opacity 0.3s;
  display: inline-block;
}

@keyframes marquee {
  0%   { transform: translateX(0); }
  10%  { transform: translateX(0); }
  90%  { transform: translateX(var(--marquee-dist, -50px)); }
  100% { transform: translateX(var(--marquee-dist, -50px)); }
}

.track-name.marquee, .artist-name.marquee {
  animation: marquee var(--marquee-dur, 8s) ease-in-out infinite alternate;
}

/* Barra de progreso */
.progress-wrap {
  height: 3px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #1ed760;
  border-radius: 2px;
  transition: width 1s linear;
  box-shadow: 0 0 6px rgba(30, 215, 96, 0.6);
}

/* Animación de texto entrante */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

.track-name.animate, .artist-name.animate {
  animation: slideIn 0.4s ease forwards;
}

/* Paused state */
.widget.paused .label-dot { animation: none; opacity: 0.3; }
.widget.paused .progress-bar { box-shadow: none; }

/* ══════════════ TEMAS (se eligen desde el dashboard) ══════════════
   Estilos inspirados en alejox/obs-music-player (MIT). "classic" = el diseño de siempre. */
@property --c1r { syntax: '<number>'; inherits: true; initial-value: 40; }
@property --c1g { syntax: '<number>'; inherits: true; initial-value: 40; }
@property --c1b { syntax: '<number>'; inherits: true; initial-value: 48; }
@property --c2r { syntax: '<number>'; inherits: true; initial-value: 18; }
@property --c2g { syntax: '<number>'; inherits: true; initial-value: 18; }
@property --c2b { syntax: '<number>'; inherits: true; initial-value: 24; }
:root { transition: --c1r 1s, --c1g 1s, --c1b 1s, --c2r 1s, --c2g 1s, --c2b 1s; }

.mac-dots, .pill-btn, .eq-icon { display: none; }
.mac-dots span { width: 11px; height: 11px; border-radius: 50%; display: block; }
.mac-dots span:nth-child(1) { background: #ff5f57; }
.mac-dots span:nth-child(2) { background: #febc2e; }
.mac-dots span:nth-child(3) { background: #28c840; }
.pill-btn { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; align-items: center; justify-content: center; background: rgba(255,255,255,0.14); color: #fff; font-size: 13px; }
.pill-btn .ico-play { display: none; }
.widget.paused .pill-btn .ico-play { display: inline; }
.widget.paused .pill-btn .ico-pause { display: none; }
.eq-icon { width: 14px; height: 14px; align-items: flex-end; gap: 2px; position: absolute; top: 12px; right: 14px; }
.eq-icon i { display: block; width: 3px; background: rgba(255,255,255,0.85); border-radius: 1px; }
.eq-icon i:nth-child(1) { height: 6px; } .eq-icon i:nth-child(2) { height: 13px; } .eq-icon i:nth-child(3) { height: 9px; }

/* Colores sacados de la portada (glass, pill, macos) */
body[data-theme="glass"] .widget,
body[data-theme="pill"] .widget,
body[data-theme="macos"] .widget {
  background: linear-gradient(135deg,
    rgba(var(--c1r), var(--c1g), var(--c1b), var(--bg-opacity, 0.75)),
    rgba(var(--c2r), var(--c2g), var(--c2b), var(--bg-opacity, 0.75)));
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
}
body[data-theme="glass"] .widget::before, body[data-theme="glass"] .widget::after,
body[data-theme="pill"] .widget::before, body[data-theme="pill"] .widget::after,
body[data-theme="macos"] .widget::before, body[data-theme="macos"] .widget::after,
body[data-theme="minimal"] .widget::before, body[data-theme="minimal"] .widget::after { display: none; }
body[data-theme="glass"] .label, body[data-theme="pill"] .label, body[data-theme="macos"] .label { color: rgba(255,255,255,0.78); }
body[data-theme="glass"] .label-dot, body[data-theme="pill"] .label-dot, body[data-theme="macos"] .label-dot { background: #fff; }
body[data-theme="glass"] .progress-bar, body[data-theme="pill"] .progress-bar, body[data-theme="macos"] .progress-bar { background: #fff; box-shadow: none; }
body[data-theme="glass"] .progress-wrap, body[data-theme="pill"] .progress-wrap, body[data-theme="macos"] .progress-wrap { background: rgba(255,255,255,0.22); }
body[data-theme="glass"] .artist-name, body[data-theme="pill"] .artist-name, body[data-theme="macos"] .artist-name { color: rgba(255,255,255,0.72); }
body[data-theme="glass"] .spotify-badge, body[data-theme="pill"] .spotify-badge, body[data-theme="macos"] .spotify-badge,
body[data-theme="minimal"] .spotify-badge { display: none; }
body[data-theme="glass"] .widget { width: 340px; }
body[data-theme="glass"] .album-art { width: 64px; height: 64px; border-radius: 12px; }

/* Pill: cápsula con indicador de reproducción */
body[data-theme="pill"] .widget { width: 380px; border-radius: 999px; padding: 12px 16px 12px 12px; }
body[data-theme="pill"] .album-art { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); }
body[data-theme="pill"] .pill-btn { display: flex; }

/* macOS: ventana con los tres puntitos */
body[data-theme="macos"] .widget { width: 360px; border-radius: 14px; padding-top: 22px; }
body[data-theme="macos"] .mac-dots { display: flex; gap: 6px; position: absolute; top: 9px; right: 12px; }
body[data-theme="macos"] .album-art { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }

/* Minimal: oscuro y sobrio, con barrita separadora */
body[data-theme="minimal"] .widget {
  width: 360px; border-radius: 14px; background: rgba(34, 34, 36, var(--bg-opacity, 0.75));
  border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 6px 22px rgba(0,0,0,0.35);
}
body[data-theme="minimal"] .album-art { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); }
body[data-theme="minimal"] .album-art-wrap::after { content: ''; position: absolute; top: 4px; bottom: 4px; right: -9px; width: 1px; background: rgba(255,255,255,0.18); }
body[data-theme="minimal"] .info { padding-left: 8px; }
body[data-theme="minimal"] .label { color: rgba(255,255,255,0.55); }
body[data-theme="minimal"] .label-dot { background: #fff; }
body[data-theme="minimal"] .progress-bar { background: #fff; box-shadow: none; }
body[data-theme="minimal"] .eq-icon { display: flex; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="mac-dots"><span></span><span></span><span></span></div>
  <div class="eq-icon"><i></i><i></i><i></i></div>
  <div class="album-art-wrap">
    <img class="album-art" id="albumArt" src="" alt="Album Art">
    <div class="spotify-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="black">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
    </div>
  </div>

  <div class="info">
    <div class="label">
      <span class="label-dot" id="labelDot"></span>
      Sonando ahora
    </div>
    <div class="track-name-wrap"><div class="track-name" id="trackName">—</div></div>
    <div class="artist-name-wrap"><div class="artist-name" id="artistName">—</div></div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
  </div>
  <div class="pill-btn"><span class="ico-pause">&#10074;&#10074;</span><span class="ico-play">&#9654;</span></div>
</div>

<script>
const username = window.location.pathname.split('/overlay/spotify/')[1];
let currentTrack = '';
let progressInterval = null;


const THEMES = ['classic', 'glass', 'pill', 'macos', 'minimal'];
function applyTheme(name) {
  const t = THEMES.includes(name) ? name : 'classic';
  if (document.body.dataset.theme !== t) document.body.dataset.theme = t;
}

// Color dominante de la portada (saturación pesa más; se oscurece para que el texto blanco se lea)
function extractCoverColors(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, 24, 24);
    const d = ctx.getImageData(0, 0, 24, 24).data;
    let r = 0, g = 0, b = 0, w = 0;
    for (let i = 0; i < d.length; i += 4) {
      const R = d[i], G = d[i + 1], B = d[i + 2];
      const max = Math.max(R, G, B), min = Math.min(R, G, B);
      const lum = (R + G + B) / 3;
      if (lum < 25 || lum > 235) continue;
      const sat = max ? (max - min) / max : 0;
      const wt = 0.15 + sat * sat * 2;
      r += R * wt; g += G * wt; b += B * wt; w += wt;
    }
    if (!w) return null;
    let col = [r / w, g / w, b / w];
    const lum = 0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2];
    const k = lum > 95 ? 95 / lum : 1;
    col = col.map(v => Math.round(v * k));
    return { c1: col, c2: col.map(v => Math.round(v * 0.55)) };
  } catch (e) { return null; } // portada sin CORS → colores por defecto
}
function setCoverColors(cols) {
  const root = document.documentElement.style;
  const c1 = cols ? cols.c1 : [40, 40, 48], c2 = cols ? cols.c2 : [18, 18, 24];
  root.setProperty('--c1r', c1[0]); root.setProperty('--c1g', c1[1]); root.setProperty('--c1b', c1[2]);
  root.setProperty('--c2r', c2[0]); root.setProperty('--c2g', c2[1]); root.setProperty('--c2b', c2[2]);
}
// Carga la portada con CORS (para leer sus colores); si el servidor de imágenes no lo permite, la muestra igual sin colores
function loadCover(artEl, url) {
  const done = () => artEl.classList.remove('fade');
  artEl.onload = () => { setCoverColors(extractCoverColors(artEl)); done(); };
  artEl.onerror = () => {
    if (artEl.crossOrigin) {
      artEl.crossOrigin = null;
      artEl.onerror = done;
      artEl.onload = () => { setCoverColors(null); done(); };
      artEl.src = url;
    } else done();
  };
  artEl.crossOrigin = 'anonymous';
  artEl.src = url || '';
}

function setupMarquee(el) {
  el.classList.remove('marquee');
  el.classList.remove('animate');
  el.style.removeProperty('--marquee-dist');
  el.style.removeProperty('--marquee-dur');
  const wrap = el.parentElement;
  const overflowAmount = el.scrollWidth - wrap.clientWidth;
  console.log('[marquee]', el.id, 'scrollWidth:', el.scrollWidth, 'clientWidth:', wrap.clientWidth, 'overflow:', overflowAmount);
  if (overflowAmount > 4) {
    el.style.setProperty('--marquee-dist', `-${overflowAmount + 12}px`);
    // Duración proporcional: más texto = más tiempo, mínimo 6s
    const dur = Math.max(6, overflowAmount / 15);
    el.style.setProperty('--marquee-dur', `${dur}s`);
    el.classList.add('marquee');
    console.log('[marquee] activado en', el.id, 'duración:', dur);
  }
}

async function fetchStatus() {
  try {
    const res = await fetch(`/api/overlay/spotify/${username}`);
    const data = await res.json();
    updateWidget(data);
  } catch(e) {}
}

function updateWidget(data) {
  const widget = document.getElementById('widget');
  const trackEl = document.getElementById('trackName');
  const artistEl = document.getElementById('artistName');
  const artEl = document.getElementById('albumArt');
  const progressEl = document.getElementById('progressBar');

  if (!data.playing) {
    widget.style.opacity = '';
    widget.classList.remove('visible');
    widget.classList.add('hidden');
    clearInterval(progressInterval);
    return;
  }

  applyTheme(data.theme);
  widget.classList.remove('hidden');
  widget.classList.add('visible');
  const opacityVal = (data.overlay_opacity ?? 100) / 100;
  widget.style.setProperty('--widget-opacity', opacityVal);
  widget.style.opacity = '';
  const bgOpacity = (data.bg_opacity ?? 75) / 100;
  widget.style.setProperty('--bg-opacity', bgOpacity);

  if (data.is_playing) {
    widget.classList.remove('paused');
  } else {
    widget.classList.add('paused');
  }

  // Si cambió la canción
  if (data.track !== currentTrack) {
    currentTrack = data.track;

    // Fade out portada y animar texto
    artEl.classList.add('fade');
    setTimeout(() => loadCover(artEl, data.image || ''), 400);

    // Animar texto
    trackEl.classList.remove('animate');
    artistEl.classList.remove('animate');
    void trackEl.offsetWidth;
    trackEl.textContent = data.track;
    artistEl.textContent = data.artist;
    trackEl.classList.add('animate');
    artistEl.classList.add('animate');

    // Detectar overflow y activar marquee si el texto es muy largo
    setTimeout(() => setupMarquee(trackEl), 600);
    setTimeout(() => setupMarquee(artistEl), 600);
  }

  // Progreso
  clearInterval(progressInterval);
  let progress = data.progress_ms || 0;
  const duration = data.duration_ms || 1;

  function updateProgress() {
    const pct = Math.min((progress / duration) * 100, 100);
    progressEl.style.width = pct + '%';
    if (data.is_playing) progress += 1000;
  }

  updateProgress();
  if (data.is_playing) {
    progressInterval = setInterval(updateProgress, 1000);
  }
}

// Iniciar
fetchStatus();
setInterval(fetchStatus, 10000);
</script>
</body>
</html>
