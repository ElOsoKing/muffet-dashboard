<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mr+Dafoe&family=Orbitron:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 20px;
}

.widget {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 0, 0, var(--bg-opacity, 0.75));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 12px 16px 12px 12px;
  width: 320px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  position: relative;
  overflow: hidden;
}

.widget.visible {
  opacity: var(--widget-opacity, 1);
  transform: translateY(0);
}

.widget.hidden {
  opacity: 0 !important;
  transform: translateY(20px);
}

/* Glow verde de fondo */
.widget::before {
  content: '';
  position: absolute;
  top: -30px;
  left: -30px;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(30, 215, 96, 0.15), transparent 70%);
  pointer-events: none;
  transition: opacity 0.5s;
}

/* Línea verde arriba */
.widget::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, #1ed760, rgba(30, 215, 96, 0.3), transparent);
  border-radius: 16px 16px 0 0;
}

/* Portada */
.album-art-wrap {
  position: relative;
  flex-shrink: 0;
}

.album-art {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  transition: opacity 0.4s ease;
  background: #1a1a1a;
}

.album-art.fade {
  opacity: 0;
}

/* Icono de Spotify en la portada */
.spotify-badge {
  position: absolute;
  bottom: -4px;
  right: -4px;
  width: 18px;
  height: 18px;
  background: #1ed760;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(0,0,0,0.8);
}

/* Info */
.info {
  flex: 1;
  min-width: 0;
}

.label {
  font-size: 9px;
  font-weight: 600;
  color: #1ed760;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.label-dot {
  width: 5px;
  height: 5px;
  background: #1ed760;
  border-radius: 50%;
  animation: blink 1.5s ease infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.track-name-wrap, .artist-name-wrap {
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  width: 100%;
  max-width: 100%;
}

.track-name {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  line-height: 1.2;
  margin-bottom: 3px;
  transition: opacity 0.3s;
  display: inline-block;
}

.artist-name {
  font-size: 11px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
  margin-bottom: 8px;
  transition: opacity 0.3s;
  display: inline-block;
}

@keyframes marquee {
  0%   { transform: translateX(0); }
  10%  { transform: translateX(0); }
  90%  { transform: translateX(var(--marquee-dist, -50px)); }
  100% { transform: translateX(var(--marquee-dist, -50px)); }
}

.track-name.marquee, .artist-name.marquee {
  animation: marquee var(--marquee-dur, 8s) ease-in-out infinite alternate;
}

/* Barra de progreso */
.progress-wrap {
  height: 3px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #1ed760;
  border-radius: 2px;
  transition: width 1s linear;
  box-shadow: 0 0 6px rgba(30, 215, 96, 0.6);
}

/* Animación de texto entrante */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

.track-name.animate, .artist-name.animate {
  animation: slideIn 0.4s ease forwards;
}

/* Paused state */
.widget.paused .label-dot { animation: none; opacity: 0.3; }
.widget.paused .progress-bar { box-shadow: none; }

/* ══════════════ TEMAS (se eligen desde el dashboard) ══════════════
   Estilos inspirados en alejox/obs-music-player (MIT). "classic" = el diseño de siempre. */
@property --c1r { syntax: '<number>'; inherits: true; initial-value: 40; }
@property --c1g { syntax: '<number>'; inherits: true; initial-value: 40; }
@property --c1b { syntax: '<number>'; inherits: true; initial-value: 48; }
@property --c2r { syntax: '<number>'; inherits: true; initial-value: 18; }
@property --c2g { syntax: '<number>'; inherits: true; initial-value: 18; }
@property --c2b { syntax: '<number>'; inherits: true; initial-value: 24; }
:root { transition: --c1r 1s, --c1g 1s, --c1b 1s, --c2r 1s, --c2g 1s, --c2b 1s; }

.mac-dots, .pill-btn, .eq-icon { display: none; }
.mac-dots span { width: 11px; height: 11px; border-radius: 50%; display: block; }
.mac-dots span:nth-child(1) { background: #ff5f57; }
.mac-dots span:nth-child(2) { background: #febc2e; }
.mac-dots span:nth-child(3) { background: #28c840; }
.pill-btn { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; align-items: center; justify-content: center; background: rgba(255,255,255,0.14); color: #fff; font-size: 13px; }
.pill-btn .ico-play { display: none; }
.widget.paused .pill-btn .ico-play { display: inline; }
.widget.paused .pill-btn .ico-pause { display: none; }
.eq-icon { width: 14px; height: 14px; align-items: flex-end; gap: 2px; position: absolute; top: 12px; right: 14px; }
.eq-icon i { display: block; width: 3px; background: rgba(255,255,255,0.85); border-radius: 1px; }
.eq-icon i:nth-child(1) { height: 6px; } .eq-icon i:nth-child(2) { height: 13px; } .eq-icon i:nth-child(3) { height: 9px; }

/* Colores sacados de la portada (glass, pill, macos) */
body[data-theme="glass"] .widget,
body[data-theme="pill"] .widget,
body[data-theme="macos"] .widget {
  background: linear-gradient(135deg,
    rgba(var(--c1r), var(--c1g), var(--c1b), var(--bg-opacity, 0.75)),
    rgba(var(--c2r), var(--c2g), var(--c2b), var(--bg-opacity, 0.75)));
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
}
body[data-theme="glass"] .widget::before, body[data-theme="glass"] .widget::after,
body[data-theme="pill"] .widget::before, body[data-theme="pill"] .widget::after,
body[data-theme="macos"] .widget::before, body[data-theme="macos"] .widget::after,
body[data-theme="minimal"] .widget::before, body[data-theme="minimal"] .widget::after { display: none; }
body[data-theme="glass"] .label, body[data-theme="pill"] .label, body[data-theme="macos"] .label { color: rgba(255,255,255,0.78); }
body[data-theme="glass"] .label-dot, body[data-theme="pill"] .label-dot, body[data-theme="macos"] .label-dot { background: #fff; }
body[data-theme="glass"] .progress-bar, body[data-theme="pill"] .progress-bar, body[data-theme="macos"] .progress-bar { background: #fff; box-shadow: none; }
body[data-theme="glass"] .progress-wrap, body[data-theme="pill"] .progress-wrap, body[data-theme="macos"] .progress-wrap { background: rgba(255,255,255,0.22); }
body[data-theme="glass"] .artist-name, body[data-theme="pill"] .artist-name, body[data-theme="macos"] .artist-name { color: rgba(255,255,255,0.72); }
body[data-theme="glass"] .spotify-badge, body[data-theme="pill"] .spotify-badge, body[data-theme="macos"] .spotify-badge,
body[data-theme="minimal"] .spotify-badge { display: none; }
body[data-theme="glass"] .widget { width: 340px; }
body[data-theme="glass"] .album-art { width: 64px; height: 64px; border-radius: 12px; }

/* Pill: cápsula con indicador de reproducción */
body[data-theme="pill"] .widget { width: 380px; border-radius: 999px; padding: 12px 16px 12px 12px; }
body[data-theme="pill"] .album-art { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); }
body[data-theme="pill"] .pill-btn { display: flex; }

/* macOS: ventana con los tres puntitos */
body[data-theme="macos"] .widget { width: 360px; border-radius: 14px; padding-top: 22px; }
body[data-theme="macos"] .mac-dots { display: flex; gap: 6px; position: absolute; top: 9px; right: 12px; }
body[data-theme="macos"] .album-art { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }

/* Minimal: oscuro y sobrio, con barrita separadora */
body[data-theme="minimal"] .widget {
  width: 360px; border-radius: 14px; background: rgba(34, 34, 36, var(--bg-opacity, 0.75));
  border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 6px 22px rgba(0,0,0,0.35);
}
body[data-theme="minimal"] .album-art { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); }
body[data-theme="minimal"] .album-art-wrap::after { content: ''; position: absolute; top: 4px; bottom: 4px; right: -9px; width: 1px; background: rgba(255,255,255,0.18); }
body[data-theme="minimal"] .info { padding-left: 8px; }
body[data-theme="minimal"] .label { color: rgba(255,255,255,0.55); }
body[data-theme="minimal"] .label-dot { background: #fff; }
body[data-theme="minimal"] .progress-bar { background: #fff; box-shadow: none; }
body[data-theme="minimal"] .eq-icon { display: flex; }

/* ══════════ Estilos con diseño propio (colores fijos, decoración animada) ══════════ */
:root { --skyline: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 60'><path d='M0 60V33h12V60zM12 60V8h8V60zM15 8v-8h2V8zM20 60V29h16V60zM27 29v-7h2V29zM38 60V27h8V60zM41 27v-7h2V27zM46 60V35h16V60zM62 60V5h16V60zM78 60V7h8V60zM87 60V33h14V60zM102 60V31h16V60zM109 31v-8h2V31zM118 60V36h12V60zM130 60V39h16V60zM148 60V8h18V60zM167 60V5h14V60zM182 60V27h12V60zM194 60V6h8V60zM204 60V14h12V60zM209 14v-4h2V14zM216 60V16h16V60zM223 16v-6h2V16zM232 60V16h14V60zM238 16v-9h2V16z'/></svg>"); }
.deco, .deco i { position: absolute; pointer-events: none; }
.deco { inset: 0; z-index: 0; overflow: hidden; border-radius: inherit; display: none; }
.deco i { display: none; }
.widget > .album-art-wrap, .widget > .info, .widget > .pill-btn { position: relative; z-index: 1; }
body[data-theme="synthwave"] .deco, body[data-theme="neoncity"] .deco, body[data-theme="cyber"] .deco,
body[data-theme="retro"] .deco, body[data-theme="glitch"] .deco, body[data-theme="line"] .deco { display: block; }
body[data-theme="synthwave"] .widget::before, body[data-theme="synthwave"] .widget::after,
body[data-theme="neoncity"] .widget::before, body[data-theme="neoncity"] .widget::after,
body[data-theme="cyber"] .widget::before, body[data-theme="cyber"] .widget::after,
body[data-theme="retro"] .widget::before, body[data-theme="retro"] .widget::after,
body[data-theme="glitch"] .widget::before, body[data-theme="glitch"] .widget::after,
body[data-theme="line"] .widget::before, body[data-theme="line"] .widget::after { display: none; }
body[data-theme="synthwave"] .spotify-badge, body[data-theme="neoncity"] .spotify-badge, body[data-theme="cyber"] .spotify-badge,
body[data-theme="retro"] .spotify-badge, body[data-theme="glitch"] .spotify-badge, body[data-theme="line"] .spotify-badge { display: none; }
body[data-theme="synthwave"] .widget, body[data-theme="neoncity"] .widget, body[data-theme="cyber"] .widget,
body[data-theme="retro"] .widget, body[data-theme="glitch"] .widget, body[data-theme="line"] .widget {
  width: 390px; min-height: 104px; padding: 14px 18px 14px 14px; gap: 16px; backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}
body[data-theme="synthwave"] .album-art, body[data-theme="neoncity"] .album-art, body[data-theme="cyber"] .album-art,
body[data-theme="retro"] .album-art, body[data-theme="glitch"] .album-art, body[data-theme="line"] .album-art {
  width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 0 0 3px var(--ring, #fff), 0 4px 16px rgba(0, 0, 0, 0.35);
}
.widget .progress-wrap { background: var(--track, rgba(255,255,255,0.12)); }

/* Synthwave: atardecer de neón con piso cuadriculado y título cursivo */
body[data-theme="synthwave"] { --ring: #2b0a3d; --track: rgba(255, 43, 214, 0.18); }
body[data-theme="synthwave"] .widget { background: rgba(18, 4, 34, var(--bg-opacity, 0.85)); border: 2px solid #ff2bd6; box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 0 14px rgba(255, 43, 214, 0.55); }
body[data-theme="synthwave"] .deco { background: linear-gradient(to bottom, rgba(40, 6, 70, 0.6), rgba(90, 10, 90, 0.5)); }
body[data-theme="synthwave"] .deco .sun {
  display: block; width: 118px; height: 118px; left: 84px; top: -26px; border-radius: 50%;
  background: linear-gradient(to bottom, #ffd23f 10%, #ff7b2e 45%, #ff2a8a 80%);
  -webkit-mask: linear-gradient(#000 52%, transparent 52%), repeating-linear-gradient(to bottom, #000 0 7%, transparent 7% 11%);
  filter: drop-shadow(0 0 10px rgba(255, 90, 140, 0.6));
}
body[data-theme="synthwave"] .deco .grid {
  display: block; left: -40%; right: -40%; bottom: -2px; height: 55%;
  background: repeating-linear-gradient(90deg, rgba(255, 43, 214, 0.75) 0 1px, transparent 1px 26px), repeating-linear-gradient(0deg, rgba(255, 43, 214, 0.75) 0 1px, transparent 1px 13px);
  transform: perspective(90px) rotateX(48deg); transform-origin: bottom;
  -webkit-mask: linear-gradient(to top, #000 10%, transparent 95%);
}
body[data-theme="synthwave"] .track-name { font-family: "Mr Dafoe", "Brush Script MT", cursive; font-weight: 400; font-size: 28px; line-height: 1.1; color: #ff3fdc; text-shadow: 0 0 10px rgba(255, 43, 214, 0.85); padding-right: 6px; }
body[data-theme="synthwave"] .artist-name { color: #35e0ff; text-shadow: 0 0 6px rgba(53, 224, 255, 0.6); font-size: 12px; }
body[data-theme="synthwave"] .label { color: #35e0ff; } body[data-theme="synthwave"] .label-dot { background: #35e0ff; }
body[data-theme="synthwave"] .progress-wrap { height: 6px; border: 1px solid rgba(255, 43, 214, 0.7); border-radius: 4px; }
body[data-theme="synthwave"] .progress-bar { background: #ff2bd6; box-shadow: 0 0 8px #ff2bd6; }

/* Neon City: noche morada con sol de rayas y edificios */
body[data-theme="neoncity"] { --ring: #ff3fd8; --track: rgba(47, 224, 255, 0.25); }
body[data-theme="neoncity"] .widget { background: linear-gradient(115deg, rgba(14, 10, 52, var(--bg-opacity, 0.85)), rgba(36, 10, 72, var(--bg-opacity, 0.85))); border: 1.5px solid rgba(160, 90, 255, 0.85); box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 0 14px rgba(140, 70, 255, 0.4); }
body[data-theme="neoncity"] .deco .sun {
  display: block; width: 104px; height: 104px; right: 40px; top: -6px; border-radius: 50%;
  background: linear-gradient(to bottom, #ff3f8e 20%, #ff7a45 75%);
  -webkit-mask: linear-gradient(#000 45%, transparent 45%), repeating-linear-gradient(to bottom, #000 0 8%, transparent 8% 12%);
  filter: drop-shadow(0 0 12px rgba(255, 70, 140, 0.55));
}
body[data-theme="neoncity"] .deco .city { display: block; right: 0; bottom: 18%; width: 62%; height: 68%; background: linear-gradient(to top, #120a2e, #2b145a); -webkit-mask: var(--skyline) right bottom / auto 100% repeat-x; }
body[data-theme="neoncity"] .deco .grid { display: block; right: 0; bottom: 0; width: 62%; height: 18%; background: repeating-linear-gradient(to bottom, rgba(255, 63, 216, 0.45) 0 1px, transparent 1px 4px), linear-gradient(to bottom, rgba(90, 30, 140, 0.6), transparent); }
body[data-theme="neoncity"] .track-name { color: #ff4fe0; text-shadow: 0 0 8px rgba(255, 63, 216, 0.6); }
body[data-theme="neoncity"] .artist-name, body[data-theme="neoncity"] .label { color: #2fe0ff; }
body[data-theme="neoncity"] .label-dot { background: #2fe0ff; }
body[data-theme="neoncity"] .progress-bar { background: #ff3fd8; box-shadow: 0 0 8px #ff3fd8; }

/* Cyber: panel HUD con esquinas cortadas y borde cian→magenta */
body[data-theme="cyber"] { --ring: #22d3ff; --track: rgba(255, 43, 214, 0.25); --cut: 16px; font-family: "Orbitron", "Eurostile", system-ui, sans-serif; }
body[data-theme="cyber"] .widget {
  background: linear-gradient(115deg, #22d3ff, #3a6bff 50%, #ff2bd6); border: none; border-radius: 0; box-shadow: none;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}
body[data-theme="cyber"] .deco {
  inset: 2px; border-radius: 0; background: linear-gradient(120deg, rgba(5, 12, 40, var(--bg-opacity, 0.9)), rgba(20, 8, 50, var(--bg-opacity, 0.9)));
  clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, 100% calc(100% - var(--cut) + 1px), calc(100% - var(--cut) + 1px) 100%, 0 100%, 0 calc(var(--cut) - 1px));
}
body[data-theme="cyber"] .deco .city { display: block; right: 0; bottom: 0; width: 60%; height: 80%; opacity: 0.35; background: linear-gradient(to top, #ff2bd6, #3a3bff 60%, #1a1f6b); -webkit-mask: var(--skyline) right bottom / auto 100% repeat-x; }
body[data-theme="cyber"] .deco .stripes { display: block; top: 6px; right: 26px; width: 46px; height: 5px; background: repeating-linear-gradient(115deg, #22d3ff 0 5px, transparent 5px 9px); }
body[data-theme="cyber"] .track-name { font-size: 15px; letter-spacing: 0.02em; color: #eaf6ff; text-shadow: 0 0 8px rgba(34, 228, 255, 0.7); }
body[data-theme="cyber"] .artist-name { font-size: 11px; color: #ff3fd8; text-shadow: 0 0 6px rgba(255, 63, 216, 0.6); }
body[data-theme="cyber"] .label { color: #22e4ff; letter-spacing: 0.14em; } body[data-theme="cyber"] .label-dot { background: #22e4ff; }
body[data-theme="cyber"] .album-art { box-shadow: 0 0 0 2px #22d3ff, 0 0 14px rgba(34, 211, 255, 0.7); }
body[data-theme="cyber"] .progress-wrap { height: 5px; border-radius: 0; }
body[data-theme="cyber"] .progress-bar { background: #22e4ff; border-radius: 0; box-shadow: 0 0 8px #22e4ff; }

/* Retro: papel viejo con franjas de arcoíris */
body[data-theme="retro"] { --ring: #1aa3a3; --track: #1c1a17; --rainbow: #d8452f 0 20%, #ec8a2d 20% 40%, #f2c14b 40% 60%, #4aa36c 60% 80%, #2b6f9a 80%; }
body[data-theme="retro"] .widget { background: rgba(238, 228, 205, var(--bg-opacity, 0.9)); border-radius: 12px; border: none; box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 0 22px rgba(120, 90, 40, 0.35); }
body[data-theme="retro"] .deco { background: radial-gradient(circle at 18% 30%, rgba(140, 110, 60, 0.12), transparent 30%), radial-gradient(circle at 70% 80%, rgba(140, 110, 60, 0.1), transparent 35%), radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.3), transparent 30%), repeating-radial-gradient(circle at 40% 60%, rgba(90, 70, 40, 0.05) 0 1px, transparent 1px 4px); }
body[data-theme="retro"] .deco .stripes { display: block; top: 0; bottom: 0; right: 0; width: 44px; background: linear-gradient(90deg, var(--rainbow)); }
body[data-theme="retro"] .info { margin-right: 40px; }
body[data-theme="retro"] .track-name { color: #1c1a17; font-weight: 800; letter-spacing: -0.01em; }
body[data-theme="retro"] .artist-name { color: #2c2925; font-weight: 600; }
body[data-theme="retro"] .label { color: #b0412c; } body[data-theme="retro"] .label-dot { background: #b0412c; }
body[data-theme="retro"] .progress-wrap { height: 7px; border-radius: 4px; border: 1.5px solid #1c1a17; background: transparent; }
body[data-theme="retro"] .progress-bar { background: #1aa3a3; box-shadow: none; }

/* Glitch / VHS: líneas de barrido, colores corridos y saltos de imagen */
body[data-theme="glitch"] { --ring: rgba(255, 255, 255, 0.85); --track: rgba(80, 220, 230, 0.25); font-family: "VT323", "Courier New", monospace; }
body[data-theme="glitch"] .widget { background: rgba(18, 18, 20, var(--bg-opacity, 0.85)); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; }
body[data-theme="glitch"] .deco { background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.45)); }
body[data-theme="glitch"] .track-name { font-size: 23px; font-weight: 400; color: #f2f2f2; text-shadow: -2px 0 rgba(255, 40, 80, 0.85), 2px 0 rgba(40, 230, 255, 0.85); animation: glitch 4s steps(1) infinite; }
body[data-theme="glitch"] .artist-name { font-size: 17px; color: #e6e6e6; text-shadow: -1px 0 rgba(255, 40, 80, 0.7), 1px 0 rgba(40, 230, 255, 0.7); }
body[data-theme="glitch"] .label { color: #50e6f0; font-size: 13px; font-weight: 400; } body[data-theme="glitch"] .label-dot { background: #50e6f0; }
body[data-theme="glitch"] .album-art { box-shadow: -3px 0 0 rgba(255, 40, 80, 0.75), 3px 0 0 rgba(40, 230, 255, 0.75), 0 0 0 2px rgba(255, 255, 255, 0.7); animation: glitch-clip 5s steps(1) infinite -1.3s; }
body[data-theme="glitch"] .progress-wrap { border: 1px solid rgba(80, 220, 230, 0.7); height: 6px; }
body[data-theme="glitch"] .progress-bar { background: #50e6f0; box-shadow: none; }
@keyframes glitch-clip { 0%, 91%, 100% { clip-path: none; } 92% { clip-path: inset(10% 0 55% 0); } 94% { clip-path: inset(60% 0 8% 0); } }
@keyframes glitch { 0%, 91%, 100% { transform: none; clip-path: none; } 92% { transform: translateX(-3px); clip-path: inset(10% 0 55% 0); } 94% { transform: translateX(3px); clip-path: inset(60% 0 8% 0); } 96% { transform: translateX(-1px); } }

/* Line: barra negra con borde blanco y rayas laterales */
body[data-theme="line"] { --ring: #fff; --track: rgba(255, 255, 255, 0.18); }
body[data-theme="line"] .widget { background: rgba(0, 0, 0, var(--bg-opacity, 0.85)); border: 2px solid #fff; border-radius: 18px; padding-left: 34px; padding-right: 34px; }
body[data-theme="line"] .deco .stripes, body[data-theme="line"] .deco .grid { display: block; top: 22%; bottom: 22%; left: 10px; width: 10px; background: repeating-linear-gradient(-55deg, #fff 0 3px, transparent 3px 9px); }
body[data-theme="line"] .deco .grid { left: auto; right: 10px; }
body[data-theme="line"] .artist-name, body[data-theme="line"] .label { color: rgba(255, 255, 255, 0.75); }
body[data-theme="line"] .label-dot { background: #fff; }
body[data-theme="line"] .progress-bar { background: #fff; box-shadow: none; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="deco"><i class="sun"></i><i class="grid"></i><i class="city"></i><i class="stripes"></i></div>
  <div class="mac-dots"><span></span><span></span><span></span></div>
  <div class="eq-icon"><i></i><i></i><i></i></div>
  <div class="album-art-wrap">
    <img class="album-art" id="albumArt" src="" alt="Album Art">
    <div class="spotify-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="black">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
    </div>
  </div>

  <div class="info">
    <div class="label">
      <span class="label-dot" id="labelDot"></span>
      Sonando ahora
    </div>
    <div class="track-name-wrap"><div class="track-name" id="trackName">—</div></div>
    <div class="artist-name-wrap"><div class="artist-name" id="artistName">—</div></div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
  </div>
  <div class="pill-btn"><span class="ico-pause">&#10074;&#10074;</span><span class="ico-play">&#9654;</span></div>
</div>

<script>
const username = window.location.pathname.split('/overlay/spotify/')[1];
let currentTrack = '';
let progressInterval = null;


const THEMES = ['classic', 'glass', 'pill', 'macos', 'minimal', 'synthwave', 'neoncity', 'cyber', 'glitch', 'retro', 'line'];
function applyTheme(name) {
  const t = THEMES.includes(name) ? name : 'classic';
  if (document.body.dataset.theme !== t) document.body.dataset.theme = t;
}

// Color dominante de la portada (saturación pesa más; se oscurece para que el texto blanco se lea)
function extractCoverColors(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, 24, 24);
    const d = ctx.getImageData(0, 0, 24, 24).data;
    let r = 0, g = 0, b = 0, w = 0;
    for (let i = 0; i < d.length; i += 4) {
      const R = d[i], G = d[i + 1], B = d[i + 2];
      const max = Math.max(R, G, B), min = Math.min(R, G, B);
      const lum = (R + G + B) / 3;
      if (lum < 25 || lum > 235) continue;
      const sat = max ? (max - min) / max : 0;
      const wt = 0.15 + sat * sat * 2;
      r += R * wt; g += G * wt; b += B * wt; w += wt;
    }
    if (!w) return null;
    let col = [r / w, g / w, b / w];
    const lum = 0.299 * col[0] + 0.587 * col[1] + 0.114 * col[2];
    const k = lum > 95 ? 95 / lum : 1;
    col = col.map(v => Math.round(v * k));
    return { c1: col, c2: col.map(v => Math.round(v * 0.55)) };
  } catch (e) { return null; } // portada sin CORS → colores por defecto
}
function setCoverColors(cols) {
  const root = document.documentElement.style;
  const c1 = cols ? cols.c1 : [40, 40, 48], c2 = cols ? cols.c2 : [18, 18, 24];
  root.setProperty('--c1r', c1[0]); root.setProperty('--c1g', c1[1]); root.setProperty('--c1b', c1[2]);
  root.setProperty('--c2r', c2[0]); root.setProperty('--c2g', c2[1]); root.setProperty('--c2b', c2[2]);
}
// Carga la portada con CORS (para leer sus colores); si el servidor de imágenes no lo permite, la muestra igual sin colores
function loadCover(artEl, url) {
  const done = () => artEl.classList.remove('fade');
  artEl.onload = () => { setCoverColors(extractCoverColors(artEl)); done(); };
  artEl.onerror = () => {
    if (artEl.crossOrigin) {
      artEl.crossOrigin = null;
      artEl.onerror = done;
      artEl.onload = () => { setCoverColors(null); done(); };
      artEl.src = url;
    } else done();
  };
  artEl.crossOrigin = 'anonymous';
  artEl.src = url || '';
}

function setupMarquee(el) {
  el.classList.remove('marquee');
  el.classList.remove('animate');
  el.style.removeProperty('--marquee-dist');
  el.style.removeProperty('--marquee-dur');
  const wrap = el.parentElement;
  const overflowAmount = el.scrollWidth - wrap.clientWidth;
  console.log('[marquee]', el.id, 'scrollWidth:', el.scrollWidth, 'clientWidth:', wrap.clientWidth, 'overflow:', overflowAmount);
  if (overflowAmount > 4) {
    el.style.setProperty('--marquee-dist', `-${overflowAmount + 12}px`);
    // Duración proporcional: más texto = más tiempo, mínimo 6s
    const dur = Math.max(6, overflowAmount / 15);
    el.style.setProperty('--marquee-dur', `${dur}s`);
    el.classList.add('marquee');
    console.log('[marquee] activado en', el.id, 'duración:', dur);
  }
}

async function fetchStatus() {
  try {
    const res = await fetch(`/api/overlay/spotify/${username}`);
    const data = await res.json();
    updateWidget(data);
  } catch(e) {}
}

function updateWidget(data) {
  const widget = document.getElementById('widget');
  const trackEl = document.getElementById('trackName');
  const artistEl = document.getElementById('artistName');
  const artEl = document.getElementById('albumArt');
  const progressEl = document.getElementById('progressBar');

  if (!data.playing) {
    widget.style.opacity = '';
    widget.classList.remove('visible');
    widget.classList.add('hidden');
    clearInterval(progressInterval);
    return;
  }

  applyTheme(data.theme);
  widget.classList.remove('hidden');
  widget.classList.add('visible');
  const opacityVal = (data.overlay_opacity ?? 100) / 100;
  widget.style.setProperty('--widget-opacity', opacityVal);
  widget.style.opacity = '';
  const bgOpacity = (data.bg_opacity ?? 75) / 100;
  widget.style.setProperty('--bg-opacity', bgOpacity);

  if (data.is_playing) {
    widget.classList.remove('paused');
  } else {
    widget.classList.add('paused');
  }

  // Si cambió la canción
  if (data.track !== currentTrack) {
    currentTrack = data.track;

    // Fade out portada y animar texto
    artEl.classList.add('fade');
    setTimeout(() => loadCover(artEl, data.image || ''), 400);

    // Animar texto
    trackEl.classList.remove('animate');
    artistEl.classList.remove('animate');
    void trackEl.offsetWidth;
    trackEl.textContent = data.track;
    artistEl.textContent = data.artist;
    trackEl.classList.add('animate');
    artistEl.classList.add('animate');

    // Detectar overflow y activar marquee si el texto es muy largo
    setTimeout(() => setupMarquee(trackEl), 600);
    setTimeout(() => setupMarquee(artistEl), 600);
  }

  // Progreso
  clearInterval(progressInterval);
  let progress = data.progress_ms || 0;
  const duration = data.duration_ms || 1;

  function updateProgress() {
    const pct = Math.min((progress / duration) * 100, 100);
    progressEl.style.width = pct + '%';
    if (data.is_playing) progress += 1000;
  }

  updateProgress();
  if (data.is_playing) {
    progressInterval = setInterval(updateProgress, 1000);
  }
}

// Iniciar
fetchStatus();
setInterval(fetchStatus, 10000);
</script>
</body>
</html>
