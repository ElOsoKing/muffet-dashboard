<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MuffetBot — Alertas</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100vw; height:100vh; }
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  video { max-width:90%; max-height:90%; border-radius:12px; opacity:0; transition:opacity 0.3s; }
  video.show { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <video id="player" playsinline></video>
  <audio id="audioPlayer"></audio>
</div>
<script>
const channel = decodeURIComponent(location.pathname.split('/').pop() || '').toLowerCase();
const video = document.getElementById('player');
const audio = document.getElementById('audioPlayer');

const queue = [];
let playing = false;

function connect() {
  const es = new EventSource(`/api/media-alerts/events/${channel}`);
  es.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'alert' && data.media_url) {
        if (queue.length < 10) queue.push(data); // límite de cola anti-spam
        processQueue();
      }
    } catch(err) {}
  };
  es.onerror = () => {
    es.close();
    setTimeout(connect, 5000); // reconectar si Render reinicia o se corta
  };
}

async function processQueue() {
  if (playing || !queue.length) return;
  playing = true;
  const alert = queue.shift();
  const vol = Math.min(100, Math.max(0, alert.volume ?? 80)) / 100;

  const el = alert.media_type === 'video' ? video : audio;
  el.src = alert.media_url;
  el.volume = vol;

  let hardStop = null;
  const cleanup = () => {
    if (hardStop) clearTimeout(hardStop);
    video.classList.remove('show');
    el.removeAttribute('src');
    el.load();
    playing = false;
    setTimeout(processQueue, 800); // pequeña pausa entre alertas
  };

  el.onended = cleanup;
  el.onerror = cleanup;

  // Tope de seguridad: duración real del archivo + 2s de margen, con techo de 90s
  // por si el navegador no reporta la duración a tiempo (archivo corrupto, etc.)
  el.onloadedmetadata = () => {
    if (hardStop) clearTimeout(hardStop);
    const safetyMs = isFinite(el.duration) && el.duration > 0
      ? Math.min(el.duration * 1000 + 2000, 90000)
      : 90000;
    hardStop = setTimeout(() => { try { el.pause(); } catch(e){} cleanup(); }, safetyMs);
  };
  // Respaldo por si loadedmetadata nunca dispara
  hardStop = setTimeout(() => { try { el.pause(); } catch(e){} cleanup(); }, 90000);

  if (alert.media_type === 'video') video.classList.add('show');
  try { await el.play(); } catch(e) { cleanup(); }
}

connect();
</script>
</body>
</html>
