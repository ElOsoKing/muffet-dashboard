<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>MuffetBot — Dock de música</title>
<style>
:root { --bg:#14151c; --bg2:#1b1d27; --line:rgba(255,255,255,0.08); --text:#eceef4; --dim:#9aa0b4; --red:#ff3b3b; --green:#1ed760; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .45; cursor: default; }

.banner { display: none; padding: 8px 12px; font-size: 12px; text-align: center; }
.banner.show { display: block; }
.banner.warn { background: rgba(255,170,0,.14); color: #ffc447; }
.banner.err { background: rgba(255,59,59,.14); color: #ff8a8a; }

.tabs { display: none; padding: 8px 12px 0; gap: 6px; }
.tabs.show { display: flex; }
.tab { padding: 5px 14px; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--dim); border: 1px solid var(--line); background: var(--bg2); }
.tab.on { color: #fff; border-color: transparent; }
.tab[data-m="yt"].on { background: var(--red); } .tab[data-m="sp"].on { background: #1db954; color: #04130a; }
.spnote { display: none; padding: 14px 16px; color: var(--dim); font-size: 12px; line-height: 1.6; }
body.sp .spnote { display: block; } body.sp .qhead, body.sp .queue { display: none; }
body.sp .src { color: #1ed760; } body.sp .fill { background: #1ed760; } body.sp .btn.main { background: #1db954; color: #04130a; } body.sp .btn.main:hover:not(:disabled) { background: #22d760; } body.sp .vol input { accent-color: #1ed760; }
#bPrev { display: none; } body.sp #bPrev { display: flex; }
.now { display: flex; gap: 12px; padding: 12px; align-items: center; border-bottom: 1px solid var(--line); }
.thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--bg2) center / cover no-repeat; flex-shrink: 0; }
.info { min-width: 0; flex: 1; }
.src { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--red); font-weight: 700; display: flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.title { font-weight: 700; font-size: 14px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.author { color: var(--dim); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.prog { padding: 0 12px; margin-top: 10px; }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--red); }
.times { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums; }

.ctrl { display: flex; align-items: center; gap: 10px; padding: 10px 12px 12px; border-bottom: 1px solid var(--line); }
.btn { width: 42px; height: 42px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 16px; transition: transform .08s, background .15s; flex-shrink: 0; }
.btn:hover:not(:disabled) { background: #262938; } .btn:active:not(:disabled) { transform: scale(.94); }
.btn.main { width: 48px; height: 48px; background: var(--red); border-color: transparent; color: #fff; font-size: 18px; }
.btn.main:hover:not(:disabled) { background: #ff5555; }
.vol { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 90px; }
.vol input { flex: 1; min-width: 0; accent-color: var(--red); }
.vol span { width: 34px; text-align: right; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

.qhead { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; }
.qhead b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.clear { font-size: 11px; color: var(--dim); padding: 4px 9px; border-radius: 12px; border: 1px solid var(--line); }
.clear:hover:not(:disabled) { color: #ff8a8a; border-color: rgba(255,59,59,.4); }
.clear.sure { background: rgba(255,59,59,.18); color: #ff8a8a; border-color: rgba(255,59,59,.5); }
.queue { flex: 1; overflow-y: auto; padding: 0 8px 12px; min-height: 60px; }
.empty { color: var(--dim); font-size: 12px; text-align: center; padding: 18px 10px; }
.item { display: flex; align-items: center; gap: 9px; padding: 6px 6px; border-radius: 8px; }
.item:hover { background: rgba(255,255,255,.04); }
.item img { width: 44px; height: 25px; border-radius: 4px; object-fit: cover; background: var(--bg2); flex-shrink: 0; }
.item .t { min-width: 0; flex: 1; }
.item .t div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 600; }
.item .t div:last-child { font-size: 10px; color: var(--dim); }
.item button { width: 26px; height: 26px; border-radius: 50%; font-size: 12px; color: var(--dim); flex-shrink: 0; }
.item button:hover { background: rgba(255,255,255,.1); color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); background: #2a2d3c; border: 1px solid var(--line); padding: 7px 14px; border-radius: 16px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="banner" class="banner"></div>

<div id="tabs" class="tabs"><button class="tab on" data-m="yt">▶ YouTube</button><button class="tab" data-m="sp">🎧 Spotify</button></div>

<div class="now">
  <div id="thumb" class="thumb"></div>
  <div class="info">
    <div class="src"><span id="dot" class="dot"></span><span id="srcTxt">Conectando…</span></div>
    <div id="title" class="title">—</div>
    <div id="author" class="author"></div>
  </div>
</div>
<div class="prog">
  <div class="bar"><div id="fill" class="fill"></div></div>
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
</div>

<div class="ctrl">
  <button id="bPrev" class="btn" title="Canción anterior" disabled>⏮</button>
  <button id="bPlay" class="btn main" title="Pausar / Reanudar" disabled>⏸</button>
  <button id="bSkip" class="btn" title="Saltar canción" disabled>⏭</button>
  <div class="vol"><span style="font-size:14px">🔊</span><input id="vol" type="range" min="0" max="100" step="1" value="100" disabled><span id="volTxt">100%</span></div>
</div>

<div id="spnote" class="spnote"></div>

<div class="qhead"><b id="qTitle">Cola</b><button id="bClear" class="clear" disabled>Vaciar cola</button></div>
<div id="queue" class="queue"><div class="empty">Cargando…</div></div>
<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const key = qs.get('key') || '';
const channel = decodeURIComponent(location.pathname.split('/dock/')[1] || '').split('/')[0].toLowerCase();
const API = `/api/dock/${encodeURIComponent(channel)}`;

let S = null;            // último estado del servidor
let T0 = 0;              // cuándo (hora local) llegó
let draggingVol = false, volTimer = null, pendingVol = null;
let clearArmed = 0;
let failures = 0;
let mode = 'yt', modeChosen = false;
try { const m = localStorage.getItem('dockMode'); if (m === 'yt' || m === 'sp') { mode = m; modeChosen = true; } } catch (e) {}

const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (sec) => { sec = Math.max(0, Math.floor(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function banner(kind, msg) { const b = $('banner'); if (!msg) { b.className = 'banner'; return; } b.className = 'banner show ' + kind; b.textContent = msg; }
const SP_ERR = {
  premium: 'Spotify solo deja controlar la reproducción desde aquí con una cuenta Premium.',
  nodevice: 'No hay un dispositivo de Spotify activo. Abre Spotify y dale play una vez.',
  reconnect: 'Vuelve a conectar Spotify desde el dashboard de MuffetBot.',
  scope: 'Vuelve a conectar Spotify desde el dashboard (faltan permisos de control).',
  notconnected: 'Spotify no está conectado en el dashboard.',
  forbidden: 'Spotify no permitió esa acción.',
  rate: 'Spotify pide ir más despacio, espera un momento.'
};

async function poll() {
  if (document.hidden || dead) return;
  try {
    const r = await fetch(`${API}/state?key=${encodeURIComponent(key)}${mode === 'sp' ? '&spotify=1' : ''}`, { cache: 'no-store' });
    if (r.status === 403) { fatal('Este link ya no es válido. Copia uno nuevo desde el dashboard de MuffetBot.'); return; }
    const j = await r.json();
    if (!j.ok) throw new Error('state');
    failures = 0; S = j; T0 = Date.now();
    banner('', '');
    if (!modeChosen) { modeChosen = true; if (!j.online && j.spotify && j.spotify.connected && mode !== 'sp') { setMode('sp', false); return; } }
    render();
  } catch (e) {
    failures++;
    if (failures >= 2) banner('err', 'Sin conexión con MuffetBot… reintentando');
  }
}
let dead = false;
function fatal(msg) { dead = true; banner('err', msg); ['bPlay', 'bSkip', 'bPrev', 'vol', 'bClear'].forEach(id => $(id).disabled = true); $('srcTxt').textContent = 'Desconectado'; $('dot').className = 'dot'; }

function setMode(m, remember = true) {
  mode = m; S = null;
  if (remember) { modeChosen = true; try { localStorage.setItem('dockMode', m); } catch (e) {} }
  document.body.classList.toggle('sp', m === 'sp');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
  $('title').textContent = '—'; $('author').textContent = ''; $('thumb').style.backgroundImage = '';
  banner('', '');
  poll();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { if (t.dataset.m !== mode) setMode(t.dataset.m); });

function render() {
  if (!S) return;
  const hasSp = !!(S.spotify && S.spotify.connected);
  $('tabs').classList.toggle('show', hasSp);
  if (!hasSp && mode === 'sp') { setMode('yt', false); return; }
  document.body.classList.toggle('sp', mode === 'sp');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === mode));
  if (mode === 'sp') renderSp(); else renderYt();
  tick();
}

function renderYt() {
  const st = S.status, on = S.online && st;
  $('dot').className = 'dot' + (on && st.state === 'playing' ? ' on' : '');
  if (!S.online) banner('warn', 'El overlay de YouTube no está abierto en OBS: no hay nada que controlar todavía.');
  $('srcTxt').textContent = !on ? 'Sin overlay' : (st.state === 'paused' ? 'En pausa' : (st.source === 'viewer' ? 'Pedido del chat' : 'Playlist'));
  $('title').textContent = on && st.title ? st.title : (S.online ? 'Nada sonando' : '—');
  $('author').textContent = on ? (st.author || '') : '';
  $('thumb').style.backgroundImage = on && st.videoId ? `url(https://img.youtube.com/vi/${encodeURIComponent(st.videoId)}/mqdefault.jpg)` : '';
  $('bPlay').textContent = on && st.state === 'paused' ? '▶' : '⏸';
  const can = !!S.online && !dead;
  $('bPlay').disabled = !can; $('bSkip').disabled = !can; $('vol').disabled = !can;
  if (!draggingVol) { $('vol').value = S.volume; $('volTxt').textContent = S.volume + '%'; }
  $('qTitle').textContent = `Cola${S.total ? ' · ' + S.total : ''}`;
  $('bClear').disabled = !S.total || dead;
  if (!S.total) { clearArmed = 0; $('bClear').classList.remove('sure'); $('bClear').textContent = 'Vaciar cola'; }
  const q = S.queue || [];
  $('queue').innerHTML = q.length ? q.map((v, i) => `
    <div class="item">
      <img loading="lazy" src="https://img.youtube.com/vi/${encodeURIComponent(v.videoId)}/default.jpg" alt="">
      <div class="t"><div title="${esc(v.title)}">${esc(v.title || v.videoId)}</div><div>@${esc(v.requestedBy || '?')}${v.durationSec ? ' · ' + fmt(v.durationSec) : ''}</div></div>
      ${i === 0 && !(on && st.source === 'viewer' && st.videoId === v.videoId) ? `<button data-act="playnow" title="Reproducir ya">▶</button>` : ''}
      <button data-act="remove" data-id="${esc(v.videoId)}" title="Quitar de la cola">✕</button>
    </div>`).join('') + (S.total > q.length ? `<div class="empty">… y ${S.total - q.length} más</div>` : '')
    : '<div class="empty">La cola está vacía. Los pedidos del chat aparecen aquí.</div>';
}

function renderSp() {
  const sp = S.spotify || {};
  const ok = !sp.error && sp.active;
  if (sp.error === 'reconnect') banner('err', SP_ERR.reconnect);
  else if (sp.error) banner('warn', 'No se pudo leer Spotify, reintentando…');
  else if (!sp.active) banner('warn', SP_ERR.nodevice);
  $('dot').className = 'dot' + (ok && sp.playing ? ' on' : '');
  $('srcTxt').textContent = !ok ? 'Spotify' : (sp.playing ? 'Spotify' : 'En pausa');
  $('title').textContent = ok ? (sp.track || 'Nada sonando') : '—';
  $('author').textContent = ok ? (sp.artist || '') : '';
  $('thumb').style.backgroundImage = ok && sp.image ? `url("${String(sp.image).replace(/"/g, '%22')}")` : '';
  $('bPlay').textContent = ok && !sp.playing ? '▶' : '⏸';
  $('bPlay').disabled = !ok; $('bSkip').disabled = !ok; $('bPrev').disabled = !ok;
  const volOk = ok && sp.volume != null && sp.volume_ok;
  $('vol').disabled = !volOk;
  if (!draggingVol && sp.volume != null) { $('vol').value = sp.volume; $('volTxt').textContent = sp.volume + '%'; }
  if (ok && !volOk) $('volTxt').textContent = '—';
  $('spnote').innerHTML = ok
    ? `Dispositivo: <b>${esc(sp.device || '?')}</b>${volOk ? '' : '<br>Este dispositivo no permite cambiar el volumen desde aquí.'}<br>Pausa, saltar y volumen necesitan Spotify Premium.`
    : 'Pausa, saltar y volumen necesitan Spotify Premium y un dispositivo con Spotify abierto.';
}

// El tiempo avanza solo entre consulta y consulta
function tick() {
  if (!S) return;
  let cur = 0, dur = 0;
  if (mode === 'sp') {
    const sp = S.spotify || {};
    if (sp.error || !sp.active) { cur = 0; dur = 0; }
    else { dur = (sp.duration_ms || 0) / 1000; cur = (sp.progress_ms || 0) / 1000; if (sp.playing) cur += (Date.now() - T0) / 1000 + Math.max(0, (S.now - (sp.ts || S.now))) / 1000; }
  } else {
    const st = S.status;
    if (S.online && st) { dur = st.duration || 0; cur = st.current || 0; if (st.state === 'playing') cur += (Date.now() - T0) / 1000 + Math.max(0, (S.now - st.ts)) / 1000; }
  }
  if (dur) cur = Math.min(cur, dur);
  $('fill').style.width = dur ? (cur / dur * 100).toFixed(1) + '%' : '0%';
  $('tCur').textContent = fmt(cur); $('tDur').textContent = dur ? fmt(dur) : '0:00';
}

async function control(action, extra) {
  if (dead) return false;
  try {
    const r = await fetch(`${API}/control`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, action, ...extra }) });
    if (r.status === 403) { fatal('Este link ya no es válido. Copia uno nuevo desde el dashboard de MuffetBot.'); return false; }
    if (r.status === 429) { toast('Demasiado rápido, espera un momento'); return false; }
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { toast(SP_ERR[j.error] || 'No se pudo, intenta de nuevo'); return false; }
    return true;
  } catch (e) { toast('Sin conexión'); return false; }
}

$('bPlay').onclick = async () => {
  if (mode === 'sp') {
    const sp = S && S.spotify; if (!sp || !sp.active) return;
    const act = sp.playing ? 'spotify_pause' : 'spotify_play';
    $('bPlay').textContent = sp.playing ? '▶' : '⏸';
    if (await control(act)) { sp.playing = !sp.playing; sp.progress_ms = (sp.progress_ms || 0) + (Date.now() - T0); T0 = Date.now(); sp.ts = S.now; render(); setTimeout(poll, 700); }
    else render();
    return;
  }
  const st = S && S.status; if (!st) return;
  const act = st.state === 'paused' ? 'play' : 'pause';
  $('bPlay').textContent = act === 'play' ? '⏸' : '▶'; // respuesta inmediata; el overlay confirma en ~3 s
  if (await control(act)) { st.state = act === 'play' ? 'playing' : 'paused'; T0 = Date.now(); S.now = st.ts; render(); }
  else render();
};
$('bSkip').onclick = async () => {
  if (mode === 'sp') { if (await control('spotify_next')) { toast('Siguiente…'); setTimeout(poll, 900); } return; }
  if (await control('skip')) toast('Saltando…');
};
$('bPrev').onclick = async () => { if (await control('spotify_prev')) { toast('Anterior…'); setTimeout(poll, 900); } };
$('vol').addEventListener('pointerdown', () => { draggingVol = true; });
window.addEventListener('pointerup', () => { draggingVol = false; });
$('vol').oninput = () => {
  const v = parseInt($('vol').value); $('volTxt').textContent = v + '%'; pendingVol = v;
  clearTimeout(volTimer);
  volTimer = setTimeout(async () => {
    const x = pendingVol;
    await control(mode === 'sp' ? 'spotify_volume' : 'volume', { value: x });
    if (S) { if (mode === 'sp' && S.spotify) S.spotify.volume = x; else S.volume = x; }
  }, 250);
};
$('bClear').onclick = async () => {
  const b = $('bClear');
  if (!clearArmed || Date.now() - clearArmed > 3000) { clearArmed = Date.now(); b.classList.add('sure'); b.textContent = '¿Seguro?'; setTimeout(() => { if (Date.now() - clearArmed >= 2900) { clearArmed = 0; b.classList.remove('sure'); b.textContent = 'Vaciar cola'; } }, 3000); return; }
  clearArmed = 0; b.classList.remove('sure'); b.textContent = 'Vaciar cola';
  if (await control('clear')) { toast('Cola vaciada'); poll(); }
};
$('queue').onclick = async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  btn.disabled = true;
  const ok = btn.dataset.act === 'playnow' ? await control('playnow') : await control('remove', { videoId: btn.dataset.id });
  if (ok) { toast(btn.dataset.act === 'playnow' ? 'Sonará enseguida' : 'Quitada'); poll(); } else btn.disabled = false;
};

if (!channel || !key) fatal('Falta el link completo. Copia el link del dock desde el dashboard de MuffetBot.');
else { document.body.classList.toggle('sp', mode === 'sp'); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === mode)); poll(); setInterval(poll, 2500); setInterval(tick, 500); document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); }); }
</script>
</body>
</html>
