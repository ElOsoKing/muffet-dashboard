<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subatón Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Orbitron:wght@700;900&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
  --add: #3ecf8e; --urgent: #e05a7a; --paused: #c9a876; }

.widget { display: none; position: relative; align-items: center; gap: 14px; }
.widget.show { display: flex; animation: pop-in .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
.deco { display: none; position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
.deco i { display: none; position: absolute; }
.icon { font-size: 30px; line-height: 1; }
.time { line-height: 1; white-space: nowrap; }
.time.paused { color: var(--paused) !important; opacity: .85; animation: none !important; }
.time.urgent { color: var(--urgent) !important; animation: pulse 1s infinite !important; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.label { font-weight: 700; text-transform: uppercase; }
.addon { position: absolute; right: 14px; top: -6px; font-weight: 800; color: var(--add); opacity: 0; pointer-events: none; white-space: nowrap; z-index: 5; }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 20% { opacity: 1; transform: translateY(-10px) scale(1.15); } 80% { opacity: 1; transform: translateY(-34px) scale(1); } 100% { opacity: 0; transform: translateY(-52px) scale(.9); } }
.addon.pop { animation: floatUp 2.4s ease-out forwards; }

/* ══════════ 1 · Clásico (el de siempre) ══════════ */
body[data-theme="clasico"] .widget { background: linear-gradient(135deg, rgba(20,16,28,.92), rgba(11,10,16,.92)); border: 1px solid rgba(139,92,246,.4); border-radius: 16px; padding: 14px 26px; box-shadow: 0 0 30px rgba(139,92,246,.25), 0 8px 24px rgba(0,0,0,.4); }
body[data-theme="clasico"] .icon { font-size: 30px; filter: drop-shadow(0 0 8px rgba(139,92,246,.6)); }
body[data-theme="clasico"] .time { font-family: 'VT323', monospace; font-size: 48px; color: #e8dfff; letter-spacing: 2px; text-shadow: 0 0 12px rgba(139,92,246,.5); }
body[data-theme="clasico"] .label { font-size: 11px; color: #8f88a8; letter-spacing: 1px; margin-top: 2px; }
body[data-theme="clasico"] .addon { font-family: 'VT323', monospace; font-size: 26px; text-shadow: 0 0 10px rgba(62,207,142,.7); }

/* ══════════ 1b · Solo números (sin fondo) ══════════ */
body[data-theme="solo"] { --add: #3ecf8e; --urgent: #ff5470; }
body[data-theme="solo"] .widget { padding: 4px 10px; }
body[data-theme="solo"] .icon, body[data-theme="solo"] .label { display: none; }
body[data-theme="solo"] .time { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 72px; letter-spacing: -1px; color: #fff; font-variant-numeric: tabular-nums; -webkit-text-stroke: 2px rgba(0,0,0,.75); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.6); }
body[data-theme="solo"] .addon { font-family: 'Inter', sans-serif; font-size: 28px; right: 6px; top: -14px; -webkit-text-stroke: 1.5px rgba(0,0,0,.75); paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0,0,0,.55); }

/* ══════════ 2 · Neón (synthwave) ══════════ */
body[data-theme="neon"] { --add: #00f0ff; --urgent: #ff3b6b; }
body[data-theme="neon"] .widget { padding: 16px 68px 18px 28px; border-radius: 14px; background: linear-gradient(180deg, #1a0638 0%, #2b0a4f 60%, #3a0d5e 100%); border: 2px solid #ff2fd0; box-shadow: 0 0 0 1px rgba(0,240,255,.6), 0 0 22px rgba(255,47,208,.55), 0 0 46px rgba(0,240,255,.25), inset 0 0 22px rgba(255,47,208,.25); }
body[data-theme="neon"] .deco { display: block; }
body[data-theme="neon"] .deco .a { display: block; left: -20%; right: -20%; bottom: 0; height: 46%; transform-origin: bottom; transform: perspective(120px) rotateX(58deg); background: repeating-linear-gradient(90deg, rgba(0,240,255,.55) 0 1px, transparent 1px 26px), repeating-linear-gradient(0deg, rgba(0,240,255,.55) 0 1px, transparent 1px 12px); opacity: .55; animation: grid-run 1.2s linear infinite; }
@keyframes grid-run { to { background-position: 0 12px, 0 12px; } }
body[data-theme="neon"] .deco .b { display: block; right: 18px; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #ffe14a, #ff2fd0); box-shadow: 0 0 18px rgba(255,47,208,.8); -webkit-mask: repeating-linear-gradient(180deg, #000 0 5px, transparent 5px 7px); mask: repeating-linear-gradient(180deg, #000 0 5px, transparent 5px 7px); }
body[data-theme="neon"] .icon, body[data-theme="neon"] .body { position: relative; z-index: 2; }
body[data-theme="neon"] .icon { font-size: 30px; filter: drop-shadow(0 0 8px #ff2fd0); }
body[data-theme="neon"] .time { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 40px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 6px #ff2fd0, 0 0 16px #ff2fd0, 0 0 30px #00f0ff; animation: neon-flicker 5s infinite; }
@keyframes neon-flicker { 0%,18%,22%,62%,64%,100% { opacity: 1; } 20%,63% { opacity: .75; } }
body[data-theme="neon"] .label { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 4px; color: #00f0ff; text-shadow: 0 0 8px #00f0ff; margin-top: 6px; }
body[data-theme="neon"] .addon { font-family: 'Orbitron', sans-serif; font-size: 22px; text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }

/* ══════════ 3 · Cyber (HUD) ══════════ */
body[data-theme="cyber"] { --add: #39ff88; --urgent: #ff4d4d; }
body[data-theme="cyber"] .widget { padding: 14px 28px; background: rgba(2,14,20,.9); border: 1px solid rgba(0,229,255,.35); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
body[data-theme="cyber"] .deco { display: block; background: repeating-linear-gradient(0deg, rgba(0,229,255,.06) 0 1px, transparent 1px 3px); }
body[data-theme="cyber"] .deco .a { display: block; left: 0; top: 0; width: 22px; height: 22px; border-top: 3px solid #00e5ff; border-left: 3px solid #00e5ff; }
body[data-theme="cyber"] .deco .b { display: block; right: 0; bottom: 0; width: 22px; height: 22px; border-bottom: 3px solid #00e5ff; border-right: 3px solid #00e5ff; }
body[data-theme="cyber"] .deco .c { display: block; left: 0; right: 0; top: 0; height: 36%; background: linear-gradient(180deg, rgba(0,229,255,.18), transparent); animation: scan 3.2s linear infinite; }
@keyframes scan { 0% { transform: translateY(-120%); } 100% { transform: translateY(330%); } }
body[data-theme="cyber"] .icon, body[data-theme="cyber"] .body { position: relative; z-index: 2; }
body[data-theme="cyber"] .icon { font-size: 28px; filter: drop-shadow(0 0 6px #00e5ff) hue-rotate(120deg); }
body[data-theme="cyber"] .time { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: 3px; color: #d8fbff; text-shadow: 0 0 10px rgba(0,229,255,.8), 2px 0 rgba(255,0,110,.5), -2px 0 rgba(0,229,255,.5); }
body[data-theme="cyber"] .label { font-family: 'VT323', monospace; font-size: 17px; font-weight: 400; letter-spacing: 3px; color: #00e5ff; margin-top: 4px; }
body[data-theme="cyber"] .label::before { content: "// "; opacity: .6; }
body[data-theme="cyber"] .addon { font-family: 'VT323', monospace; font-size: 28px; text-shadow: 0 0 10px #39ff88; }

/* ══════════ 4 · Cristal (minimal) ══════════ */
body[data-theme="glass"] { --add: #7dffb2; --urgent: #ff7a8a; }
body[data-theme="glass"] .widget { padding: 14px 30px 14px 24px; gap: 16px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35); }
body[data-theme="glass"] .icon { width: 12px; height: 12px; border-radius: 50%; background: #ff4d6a; box-shadow: 0 0 0 4px rgba(255,77,106,.25), 0 0 14px #ff4d6a; font-size: 0; animation: live 1.6s ease-in-out infinite; }
@keyframes live { 50% { transform: scale(.7); opacity: .6; } }
body[data-theme="glass"] .time { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -1px; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
body[data-theme="glass"] .label { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,.75); margin-top: 3px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
body[data-theme="glass"] .addon { font-size: 22px; text-shadow: 0 2px 12px rgba(0,0,0,.45); right: 28px; }

/* ══════════ 5 · Arcade (8-bit) ══════════ */
body[data-theme="arcade"] { --add: #5dff7a; --urgent: #ff4a4a; --paused: #ffd24a; }
body[data-theme="arcade"] .widget { padding: 16px 22px; background: #14123a; border: 4px solid #ffd24a; box-shadow: 0 0 0 4px #14123a, 0 0 0 8px #ff4a8d, 6px 8px 0 8px rgba(0,0,0,.5); border-radius: 0; image-rendering: pixelated; }
body[data-theme="arcade"] .deco { display: block; background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px); }
body[data-theme="arcade"] .icon { font-size: 26px; filter: saturate(1.4); animation: coin 1.2s steps(4) infinite; }
@keyframes coin { 0% { transform: scaleX(1); } 25% { transform: scaleX(.55); } 50% { transform: scaleX(.12); } 75% { transform: scaleX(.55); } 100% { transform: scaleX(1); } }
body[data-theme="arcade"] .time { font-family: 'Press Start 2P', monospace; font-size: 26px; letter-spacing: 0; color: #ffd24a; text-shadow: 3px 3px 0 #b3251f; }
body[data-theme="arcade"] .label { font-family: 'Press Start 2P', monospace; font-size: 8px; font-weight: 400; letter-spacing: 0; color: #5de6ff; margin-top: 9px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
body[data-theme="arcade"] .label::before { content: "▶ "; }
body[data-theme="arcade"] .addon { font-family: 'Press Start 2P', monospace; font-size: 14px; text-shadow: 3px 3px 0 #0b3d12; }

/* ══════════ 6 · Fuego (épico) ══════════ */
body[data-theme="fuego"] { --add: #ffd23c; --urgent: #fff; }
body[data-theme="fuego"] .widget { padding: 14px 30px; border-radius: 14px; background: linear-gradient(180deg, #1c0a06, #2c0e06 70%, #4a1606); border: 2px solid #ff6a00; box-shadow: 0 0 22px rgba(255,106,0,.55), 0 0 50px rgba(255,40,0,.3), inset 0 -18px 30px rgba(255,80,0,.28); }
body[data-theme="fuego"] .deco { display: block; background: linear-gradient(to top, rgba(255,90,0,.38), transparent 55%); }
body[data-theme="fuego"] .deco i { display: block; bottom: -4px; width: 5px; height: 5px; border-radius: 50%; background: #ffb347; box-shadow: 0 0 8px #ff7a00; animation: ember 2.6s linear infinite; opacity: 0; }
body[data-theme="fuego"] .deco .a { left: 16%; animation-delay: 0s; }
body[data-theme="fuego"] .deco .b { left: 48%; animation-delay: 1s; animation-duration: 3.1s; }
body[data-theme="fuego"] .deco .c { left: 80%; animation-delay: 1.8s; animation-duration: 2.3s; }
@keyframes ember { 0% { transform: translate(0,0) scale(1); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(10px,-70px) scale(.2); opacity: 0; } }
body[data-theme="fuego"] .icon, body[data-theme="fuego"] .body { position: relative; z-index: 2; }
body[data-theme="fuego"] .icon { font-size: 34px; filter: drop-shadow(0 0 10px #ff6a00); animation: flame 1.1s ease-in-out infinite; }
@keyframes flame { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }
body[data-theme="fuego"] .time { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 42px; letter-spacing: 2px; background: linear-gradient(180deg, #fff6c2 0%, #ffd23c 35%, #ff6a00 75%, #d61a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(255,106,0,.7)); }
body[data-theme="fuego"] .time.urgent, body[data-theme="fuego"] .time.paused { background: none; -webkit-background-clip: border-box; background-clip: border-box; }
body[data-theme="fuego"] .label { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 4px; color: #ff9a4a; margin-top: 6px; }
body[data-theme="fuego"] .addon { font-family: 'Orbitron', sans-serif; font-size: 22px; text-shadow: 0 0 12px #ff6a00; }

/* ══════════ 7 · Exclusivo de Wolf: Lobo Rey (glitch rojo/violeta) ══════════ */
body[data-theme="wolf"] { --add: #ff3347; --urgent: #ffffff; font-family: 'VT323', monospace; }
body[data-theme="wolf"] .widget { padding: 16px 92px 16px 26px; background: #07060a; border: 2px solid #ff1a2e; box-shadow: 0 0 0 2px #07060a, 0 0 0 4px rgba(140,60,255,.85), 0 0 24px rgba(255,26,46,.4); border-radius: 0; }
body[data-theme="wolf"] .deco { display: block; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5)); }

body[data-theme="wolf"] .body { position: relative; z-index: 2; }
body[data-theme="wolf"] .time { font-size: 58px; color: #f4f4f6; letter-spacing: 3px; text-shadow: -3px 0 rgba(255,26,46,.9), 3px 0 rgba(140,60,255,.85); animation: glitch 4s steps(1) infinite; }
body[data-theme="wolf"] .label { font-size: 20px; font-weight: 400; letter-spacing: .14em; color: #ff3347; margin-top: 2px; }
body[data-theme="wolf"] .addon { font-size: 34px; font-weight: 400; text-shadow: -2px 0 rgba(255,26,46,.9), 2px 0 rgba(140,60,255,.85); }
@keyframes glitch { 0%,92%,100% { transform: none; } 93% { transform: translate(-3px,1px) skewX(-6deg); } 95% { transform: translate(3px,-1px) skewX(5deg); } 97% { transform: translate(-1px,0); } }
@keyframes glitch-clip { 0%,90%,100% { clip-path: none; transform: scaleX(-1); } 91% { clip-path: inset(10% 0 55% 0); transform: scaleX(-1) translateX(5px); } 93% { clip-path: inset(55% 0 10% 0); transform: scaleX(-1) translateX(-5px); } 95% { clip-path: none; transform: scaleX(-1); } }

<body data-theme="clasico">
<div class="widget" id="widget">
  <div class="deco"><i class="a"></i><i class="b"></i><i class="c"></i></div>
  <div class="icon" id="iconEl">🕷️⏱️</div>
  <div class="body">
    <div class="time" id="timeDisplay">00:00:00</div>
    <div class="label" id="labelText">SUBATÓN</div>
  </div>
  <div class="addon" id="addonPopup"></div>
</div>
<script>
const THEMES = ['clasico','solo','neon','cyber','glass','arcade','fuego','wolf','oso'];
const params = new URLSearchParams(location.search);
const channel = decodeURIComponent(location.pathname.split('/').pop() || '').toLowerCase();
const previewTheme = THEMES.includes(params.get('preview')) ? params.get('preview') : null; // vista previa desde el dashboard
const widget = document.getElementById('widget');
const timeDisplay = document.getElementById('timeDisplay');
const labelText = document.getElementById('labelText');
const addonPopup = document.getElementById('addonPopup');

let targetEndTime = null, staticRemaining = null, running = false, lastKnownSeconds = null;

const ICONS = { clasico: '🕷️⏱️', solo: '', neon: '⏱️', cyber: '⏱️', glass: '', arcade: '🪙', fuego: '🔥', wolf: '', oso: '' };
function setTheme(t) {
  const th = THEMES.includes(t) ? t : 'clasico';
  document.body.setAttribute('data-theme', th);
  document.getElementById('iconEl').textContent = ICONS[th];
}

function formatTime(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(totalSeconds / 3600), m = Math.floor((totalSeconds % 3600) / 60), s = totalSeconds % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function currentSeconds() {
  if (running && targetEndTime) return Math.max(0, (targetEndTime - Date.now()) / 1000);
  return staticRemaining || 0;
}
function tick() {
  const secs = currentSeconds();
  timeDisplay.textContent = formatTime(secs);
  timeDisplay.classList.toggle('paused', !running);
  timeDisplay.classList.toggle('urgent', running && secs > 0 && secs < 120);
  labelText.textContent = running ? 'SUBATÓN' : 'SUBATÓN (pausado)';
  if (lastKnownSeconds !== null && secs > lastKnownSeconds + 1) {
    const added = Math.round((secs - lastKnownSeconds) / 60);
    if (added > 0) showAddon(added);
  }
  lastKnownSeconds = secs;
}
function showAddon(minutes) {
  addonPopup.textContent = `+${minutes} min`;
  addonPopup.classList.remove('pop');
  void addonPopup.offsetWidth;
  addonPopup.classList.add('pop');
}
async function syncState() {
  try {
    const res = await fetch(`/api/subathon/state/${channel}`);
    const data = await res.json();
    if (!data.enabled) { widget.classList.remove('show'); return; }
    setTheme(data.theme);
    widget.classList.add('show');
    running = data.running;
    targetEndTime = data.target_end_time ? new Date(data.target_end_time).getTime() : null;
    staticRemaining = data.remaining_seconds || 0;
  } catch(e) {}
}

if (previewTheme) {
  // Vista previa: siempre visible, con un tiempo de ejemplo y un "+5 min" cada pocos segundos
  setTheme(previewTheme);
  widget.classList.add('show');
  running = true;
  targetEndTime = Date.now() + (3600 + 23 * 60 + 45) * 1000;
  setInterval(() => { targetEndTime += 5 * 60 * 1000; }, 6000);
} else {
  syncState();
  setInterval(syncState, 10000);
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
